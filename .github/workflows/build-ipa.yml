name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Zenzai model
        uses: actions/cache@v4
        with:
          path: Keyboard/Models/ggml-model-Q5_K_M.gguf
          key: zenz-v3.2-small-q5km-v1

      - name: Download Zenzai model
        run: |
          if [ ! -f Keyboard/Models/ggml-model-Q5_K_M.gguf ]; then
            mkdir -p Keyboard/Models
            curl -fL -o Keyboard/Models/ggml-model-Q5_K_M.gguf \
              https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/main/ggml-model-Q5_K_M.gguf
          fi
          head -c 4 Keyboard/Models/ggml-model-Q5_K_M.gguf | grep -q GGUF
          ls -lh Keyboard/Models/

      - name: Build unsigned
        run: |
          xcodebuild \
            -project RinhaBoard.xcodeproj \
            -scheme RinhaBoard \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify keyboard extension is embedded
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          ls "$APP/PlugIns"
          test -d "$APP/PlugIns/RinhaBoardKeyboard.appex"
          ls -lh "$APP/PlugIns/RinhaBoardKeyboard.appex/ggml-model-Q5_K_M.gguf"
          APPEX_BIN="$APP/PlugIns/RinhaBoardKeyboard.appex/RinhaBoardKeyboard"
          if nm "$APPEX_BIN" 2>/dev/null | grep -q "llama_model_load_from_file"; then
            echo "Zenzai trait active: real llama symbols are referenced"
          else
            echo "ERROR: Zenzai trait NOT active (mock build) - refusing to ship"
            exit 1
          fi

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r SparkleKey-unsigned-v0.6.2.ipa Payload
          ls -lh SparkleKey-unsigned-v0.6.2.ipa

      - name: Upload IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SparkleKey-unsigned
          path: SparkleKey-unsigned-v0.6.2.ipa
          retention-days: 14

      - name: Publish IPA as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="SparkleKey-unsigned-v0.6.2.ipa"
          TAG="v$(echo "$IPA" | sed -E 's/.*-v([0-9]+\.[0-9]+\.[0-9]+)\.ipa/\1/')"
          echo "Publishing $IPA to release $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "Sparkle Key $TAG" \
              --notes "Unsigned IPA built by GitHub Actions. Sign and install with AltStore Classic or LiveContainer. Requires iOS 17 or later. Enable in Settings > General > Keyboard > Keyboards, and allow Full Access for clipboard history."
          fi
